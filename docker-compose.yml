services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: sales_dashboard
      POSTGRES_USER: sales
      POSTGRES_PASSWORD: sales
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sales -d sales_dashboard"]
      interval: 5s
      timeout: 5s
      retries: 20
    ports:
      # High host port: 5432/5433 often taken by local Windows PostgreSQL / KOMPAS.
      - "15432:5432"

  api:
    build:
      context: ./backend/src/SalesDashboard.Api
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Default: Host=db;Port=5432;Database=sales_dashboard;Username=sales;Password=sales
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "5080:8080"

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    depends_on:
      api:
        condition: service_started
    ports:
      - "8080:80"
    restart: unless-stopped

volumes:
  pgdata:
